name: Deploy Staging

on:
  push:
    branches: [staging]

env:
  AWS_REGION: us-east-1

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push API image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -f apps/api/Dockerfile \
            -t ${{ steps.login-ecr.outputs.registry }}/queue-view/api:staging-$IMAGE_TAG \
            -t ${{ steps.login-ecr.outputs.registry }}/queue-view/api:staging \
            .
          docker push ${{ steps.login-ecr.outputs.registry }}/queue-view/api:staging-$IMAGE_TAG
          docker push ${{ steps.login-ecr.outputs.registry }}/queue-view/api:staging

      - name: Build & push Web image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -f apps/web/Dockerfile \
            -t ${{ steps.login-ecr.outputs.registry }}/queue-view/web:staging-$IMAGE_TAG \
            -t ${{ steps.login-ecr.outputs.registry }}/queue-view/web:staging \
            .
          docker push ${{ steps.login-ecr.outputs.registry }}/queue-view/web:staging-$IMAGE_TAG
          docker push ${{ steps.login-ecr.outputs.registry }}/queue-view/web:staging

      - name: Deploy to EC2 Staging
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST_STAGING }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,AWS_REGION
          script: |
            aws ecr get-login-password --region $AWS_REGION | \
              docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.$AWS_REGION.amazonaws.com

            cd ~/app
            export IMAGE_TAG=staging-${{ github.sha }}
            export ECR_REGISTRY=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.$AWS_REGION.amazonaws.com

            docker compose -f docker-compose.staging.yml pull
            docker compose -f docker-compose.staging.yml up -d --remove-orphans
            docker image prune -f
