name: Deploy Production

on:
  push:
    branches: [main]

env:
  AWS_REGION: eu-central-1  # поменяй на свой регион
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.eu-central-1.amazonaws.com

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push API image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -f apps/api/Dockerfile \
            -t ${{ steps.login-ecr.outputs.registry }}/queue-view/api:$IMAGE_TAG \
            -t ${{ steps.login-ecr.outputs.registry }}/queue-view/api:latest \
            .
          docker push ${{ steps.login-ecr.outputs.registry }}/queue-view/api:$IMAGE_TAG
          docker push ${{ steps.login-ecr.outputs.registry }}/queue-view/api:latest

      - name: Build & push Web image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -f apps/web/Dockerfile \
            -t ${{ steps.login-ecr.outputs.registry }}/queue-view/web:$IMAGE_TAG \
            -t ${{ steps.login-ecr.outputs.registry }}/queue-view/web:latest \
            .
          docker push ${{ steps.login-ecr.outputs.registry }}/queue-view/web:$IMAGE_TAG
          docker push ${{ steps.login-ecr.outputs.registry }}/queue-view/web:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST_PROD }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,AWS_REGION
          script: |
            aws ecr get-login-password --region $AWS_REGION | \
              docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.$AWS_REGION.amazonaws.com

            cd ~/app
            export IMAGE_TAG=${{ github.sha }}
            export ECR_REGISTRY=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.$AWS_REGION.amazonaws.com

            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
