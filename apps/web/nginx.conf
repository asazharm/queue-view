server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Проксируем API запросы на бэк
    location /api {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
    }
}
